<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14407a">
<title>Pádel & Birras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --court:#14407a; --court2:#0e2f5c; --line:#f4f1e8; --ball:#d8f23a; --ball-d:#a9c214;
  --paper:#fbf8ef; --ink:#14213d; --muted:#5d6a85; --beer:#f2a516; --foam:#fff6dc;
  --red:#e0473a; --green:#1f9d61; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:var(--court);
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.12) calc(50% - 1px),rgba(255,255,255,.12) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(transparent 0 220px,rgba(255,255,255,.12) 220px 222px,transparent 222px);
  min-height:100vh;padding-bottom:90px}
h1,h2,h3,.disp{font-family:"Bungee",system-ui,sans-serif;font-weight:400;letter-spacing:.5px}
header{padding:22px 18px 8px;color:var(--line);max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1ff7a,var(--ball) 45%,var(--ball-d));position:relative;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.logo:before,.logo:after{content:"";position:absolute;inset:6px -14px;border:3px solid #fff;border-radius:50%;border-color:#fff transparent transparent transparent;transform:rotate(25deg)}
.logo:after{transform:rotate(205deg)}
header h1{margin:0;font-size:26px;line-height:1}
header .sub{font-size:13px;opacity:.8;margin-top:4px}
.me{margin-left:auto;text-align:right;font-size:12px}
.me select{font:inherit;font-size:13px;border-radius:999px;border:0;padding:6px 10px;background:var(--ball);color:var(--ink);font-weight:600;max-width:150px}
main{max-width:760px;margin:0 auto;padding:6px 14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--court2);display:flex;justify-content:center;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;border-top:3px solid var(--line)}
nav a{flex:1;max-width:130px;text-align:center;color:var(--line);text-decoration:none;font-size:11px;padding:6px 2px;border-radius:12px;font-weight:600}
nav a span{display:block;font-size:22px;line-height:1.1}
nav a.on{background:var(--ball);color:var(--ink)}
.card{background:var(--paper);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.card h2{margin:0 0 8px;font-size:19px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:var(--ink);color:var(--line);font-size:14px}
.btn.ball{background:var(--ball);color:var(--ink);box-shadow:0 3px 0 var(--ball-d)}
.btn.beer{background:var(--beer);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.big-cta{display:flex;gap:10px;margin:10px 0}
.big-cta .btn{flex:1;padding:14px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--line);padding:30px 10px;font-size:15px}
.empty .e{font-size:44px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e7e3d6;text-transform:uppercase;letter-spacing:.4px}
.tag.pend{background:var(--ball)} .tag.done{background:var(--ink);color:var(--line)} .tag.warn{background:var(--beer)} .tag.out{background:var(--red);color:#fff} .tag.ok{background:#cdeedd;color:var(--green)}
/* match */
.match .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}
.team{font-weight:800;font-size:15px;line-height:1.3}
.team.r{text-align:right}
.team.win{color:var(--green)}
.team .crown{font-size:14px}
.vs{font-family:Bungee;font-size:14px;color:var(--muted)}
.score{display:flex;gap:6px;justify-content:center;margin:4px 0 2px;flex-wrap:wrap}
.set{background:var(--court);color:var(--line);border-radius:10px;padding:6px 10px;font-family:Bungee;font-size:16px;min-width:56px;text-align:center}
.set small{display:block;font-family:"Bricolage Grotesque";font-size:9px;opacity:.75;letter-spacing:.5px}
.set.third{background:var(--beer);color:var(--ink)}
.photo{width:100%;border-radius:12px;margin-top:10px;display:block;max-height:420px;object-fit:cover;background:#ddd}
.chron{font-style:italic;background:var(--foam);border-left:4px solid var(--beer);padding:8px 10px;border-radius:8px;margin-top:10px;font-size:14px}
.slot{display:inline-block;border:2px dashed var(--muted);border-radius:8px;padding:1px 8px;color:var(--muted);font-weight:600;font-size:13px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;font-weight:800}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:9px 4px;border-top:1px solid #e4dfcf;text-align:right}
td.pos{font-family:Bungee;width:34px;text-align:center}
td .pts{font-family:Bungee;font-size:16px}
tr.top1 td.pos{color:#c79200} tr.last td{background:#fdeceb}
.seg{display:flex;background:#e7e3d6;border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:800;padding:8px;border-radius:999px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:var(--line)}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.award{background:var(--foam);border-radius:12px;padding:10px}
.award .t{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}
.award .n{font-weight:800;font-size:16px;margin-top:2px}
.award .d{font-size:12px;color:var(--muted)}
/* players */
.plist{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff}
.av{width:42px;height:42px;border-radius:50%;background:var(--ball);display:grid;place-items:center;font-size:22px;flex:none}
.pl .nm{font-weight:800}
.pl .info{flex:1;min-width:0}
.pl.out{opacity:.65;background:#fdeceb}
/* beer */
.beerhero{background:linear-gradient(var(--foam) 0 22%,var(--beer) 22%);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22);margin:12px 0}
.beerhero .num{font-family:Bungee;font-size:54px;line-height:1}
.debt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e4dfcf}
.debt:first-of-type{border-top:0}
.debt .info{flex:1}
.debt.paid .info{text-decoration:line-through;opacity:.6}
/* candidates */
.cand .votes{display:flex;gap:6px;margin:8px 0}
.aport{background:#fff;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.aport b{font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,40,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:10px;border:2px solid #d9d3c0;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setrow{display:grid;grid-template-columns:60px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.setrow input{text-align:center;font-family:Bungee;font-size:18px}
.pairbox{border:2px solid #e4dfcf;border-radius:12px;padding:8px 10px;margin-top:8px}
.pairbox .disp{font-size:13px}
.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--line);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.banner{background:var(--beer);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin:8px 0}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:22px;border:2px solid transparent;background:#fff;border-radius:10px;padding:4px 6px;cursor:pointer}
.emojis button.on{border-color:var(--ink)}
.filelbl{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--muted);border-radius:12px;padding:14px;cursor:pointer;font-weight:700;text-transform:none;font-size:14px;color:var(--ink)}
.preview{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.rule .i{font-size:22px}
</style>
</head>

<header>
  <div class="logo" aria-hidden="true"></div>
  <div>
    <h1>Pádel&nbsp;&amp;&nbsp;Birras</h1>
    <div class="sub">Liga oficiosa · el tercer set siempre es de cebada</div>
  </div>
  <div class="me"><div style="opacity:.8;margin-bottom:3px">Soy…</div><select id="meSel"></select></div>

<main id="app"><div class="empty"><div class="e">🎾</div>Calentando en la pista…</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, doc, collection, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvfhPaBjO0WQGkW-H8i4uLCfPAKk1E5fA",
  authDomain: "padel-y-birras.firebaseapp.com",
  projectId: "padel-y-birras",
  storageBucket: "padel-y-birras.firebasestorage.app",
  messagingSenderId: "968100211527",
  appId: "1:968100211527:web:7fb7b384a4ea8062e77a62"
};

const app = initializeApp(firebaseConfig);
const fs = initializeFirestore(app, { ignoreUndefinedProperties: true });
const auth = getAuth(app);

// Firestore no admite arrays dentro de arrays (p. ej. los sets): se codifican al guardar y se decodifican al leer
const enc = v => Array.isArray(v) ? v.map(x => Array.isArray(x) ? { __a: enc(x) } : enc(x))
  : (v && typeof v === "object") ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, enc(x)])) : v;
const dec = v => Array.isArray(v) ? v.map(x => (x && typeof x === "object" && "__a" in x) ? dec(x.__a) : dec(x))
  : (v && typeof v === "object") ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, dec(x)])) : v;

const timed = p => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 12000))]);
const snapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.exists() ? dec(d.data()) : undefined, metadata: d.metadata });
const docRef = r => ({
  id: r.id, path: r.path,
  get: async () => snapDoc(await getDoc(r)),
  set: data => timed(setDoc(r, enc(data))),
  update: data => timed(updateDoc(r, enc(data))),
  delete: () => timed(deleteDoc(r)),
});
const colRef = c => ({
  path: c.path,
  doc: id => docRef(id ? doc(c, id) : doc(c)),
  add: async data => docRef(await timed(addDoc(c, enc(data)))),
  onSnapshot: (next, err) => onSnapshot(c, { includeMetadataChanges: true },
    s => next({ docs: s.docs.map(snapDoc), size: s.size, empty: s.empty, metadata: s.metadata }), err),
});
const dbShim = { doc: p => docRef(doc(fs, p)), collection: p => colRef(collection(fs, p)) };

const ready = new Promise(res => {
  onAuthStateChanged(auth, u => { if (u) { window.__uid = u.uid; res(true); } });
  signInAnonymously(auth).catch(e => { console.error("auth", e); window.__authErr = e?.code || String(e); res(false); });
});
window.__project = firebaseConfig.projectId;
window.__padelReady(ready.then(ok => ok ? dbShim : null));
</script>
<script>

<script>
const EMOJIS=["🦁","🐻","🦊","🐺","🐗","🦍","🐙","🦖","🐸","🐔","🦆","🐌","🦄","🐷","🐼","🦈","🍔","🌶️","🥨","🧔","👴","🤠","🥷","🧙"];
const S={players:[],matches:[],candidates:[],aport:[],debts:{},loaded:{},canWrite:true,view:"partidos",rankMode:"ind"};
let db=null, assets=null, userCap=null;
const photoCache={};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function mkey(iso){return (iso||"").slice(0,7)}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function mname(k){const[y,m]=k.split("-");return MESES[+m-1]+" "+y}
function fdate(iso,time){if(!iso)return"";const d=new Date(iso+"T12:00");return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})+(time?" · "+time:"")}
function daysSince(iso){return Math.floor((Date.now()-new Date(iso+"T12:00").getTime())/864e5)}
function nextMonth(k){let[y,m]=k.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+String(m).padStart(2,"0")}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function P(id){return S.players.find(p=>p.id===id)}
function pname(id){const p=P(id);return p?p.name:"¿?"}
function pav(id){const p=P(id);return p?.emoji||"🎾"}
function getMe(){try{return localStorage.getItem("padel_me")||""}catch(e){return""}}
function setMe(v){try{localStorage.setItem("padel_me",v)}catch(e){}}

/* ---------- derived stats ---------- */
function played(){return S.matches.filter(m=>m.status==="played"&&m.winner)}
function matchPlayers(m){return [...(m.teamA||[]),...(m.teamB||[])].filter(Boolean)}
function lastPlayed(pid){let l=null;for(const m of played())if(matchPlayers(m).includes(pid)&&(!l||m.date>l))l=m.date;return l}
function playerStatus(p){
  const base=[lastPlayed(p.id),p.readmittedAt,p.joinedAt].filter(Boolean).sort().pop()||todayISO();
  const d=daysSince(base);
  if(d>90)return{k:"out",label:"Fuera del grupo",d};
  if(d>60)return{k:"warn",label:"Al borde del abismo",d};
  return{k:"ok",label:"En forma",d};
}
function setGames(m,side){return (m.sets||[]).reduce((a,s)=>a+(+s[side==="A"?0:1]||0),0)}
function setsWon(m,side){return (m.sets||[]).filter(s=>side==="A"?+s[0]>+s[1]:+s[1]>+s[0]).length}
function blank(){return{pj:0,pg:0,pp:0,sf:0,sc:0,gf:0,gc:0,pts:0,streak:0,form:[]}}
function addRes(o,won,m,side){
  const other=side==="A"?"B":"A";
  o.pj++;won?o.pg++:o.pp++;o.pts+=won?3:1;
  o.sf+=setsWon(m,side);o.sc+=setsWon(m,other);o.gf+=setGames(m,side);o.gc+=setGames(m,other);
  o.form.push(won?"V":"D");
}
function finalize(o){o.form=o.form.slice(-5);let s=0;for(let i=o.form.length-1;i>=0;i--){if(o.form[i]===o.form[o.form.length-1])s++;else break}o.streak=o.form.length?(o.form[o.form.length-1]==="V"?s:-s):0;o.pct=o.pj?Math.round(o.pg*100/o.pj):0;return o}
function sortRank(a,b){return b.pts-a.pts||(b.sf-b.sc)-(a.sf-a.sc)||(b.gf-b.gc)-(a.gf-a.gc)||b.pct-a.pct}
function indRanking(){
  const map={};
  const ms=played().sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  for(const m of ms){for(const side of["A","B"]){for(const pid of (side==="A"?m.teamA:m.teamB)||[]){if(!pid)continue;map[pid]=map[pid]||blank();addRes(map[pid],m.winner===side,m,side)}}}
  return S.players.filter(p=>!p.retired).map(p=>({id:p.id,...finalize(map[p.id]||blank())})).sort(sortRank);
}
function pairKey(a){return [...a].sort().join("|")}
function pairRanking(){
  const map={};
  const ms=played().sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  for(const m of ms){for(const side of["A","B"]){const t=(side==="A"?m.teamA:m.teamB)||[];if(t.filter(Boolean).length<2)continue;const k=pairKey(t);map[k]=map[k]||{ids:[...t].sort(),...blank()};addRes(map[k],m.winner===side,m,side)}}
  return Object.values(map).map(finalize).sort(sortRank);
}
function debtsList(){
  const cur=mkey(todayISO()),out=[];
  for(const p of S.players){
    if(p.retired)continue;
    let k=nextMonth(mkey(p.joinedAt||todayISO())); // el mes de alta no cuenta
    let guard=0;
    while(k<cur&&guard++<60){
      const did=played().some(m=>mkey(m.date)===k&&matchPlayers(m).includes(p.id));
      if(!did){const id=p.id+"_"+k;out.push({id,pid:p.id,month:k,paid:!!S.debts[id]?.paid,paidAt:S.debts[id]?.paidAt})}
      k=nextMonth(k);
    }
  }
  return out.sort((a,b)=>b.month.localeCompare(a.month));
}
function beersStats(){
  let total=0;const payers={};
  for(const m of played()){total+=+(m.beer?.cervezas||0);for(const pid of (m.beer?.payers||[]))payers[pid]=(payers[pid]||0)+1}
  for(const d of debtsList())if(d.paid)payers[d.pid]=(payers[d.pid]||0)+1;
  return{total,payers};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===S.view));
  renderMe();
  const app=$("#app");
  if(S.dbErr){app.innerHTML=`<div class="card"><h2>La base de datos no responde</h2>${dbHelp(S.dbErr)}<p class="muted">Código: ${esc(S.dbErr)}</p><button class="btn ball" onclick="location.reload()">Reintentar</button></div>`;return}
  if(!S.loaded.players){app.innerHTML=S.slow?`<div class="card"><h2>Conectado, pero la base de datos no contesta</h2><p>El inicio de sesión ya funciona ✅. Lo que falta es <b>Firestore</b>:</p><p>En Firebase: <b>Bases de datos y almacenamiento → Firestore Database</b>. Si sale <b>“Crear base de datos”</b>, créala (modo producción, ubicación <b>eur3</b>) y deja el ID como <b>(default)</b>.</p><p>Luego, en la pestaña <b>Reglas</b>, pega las reglas y pulsa <b>Publicar</b>.</p><button class="btn ball" onclick="location.reload()">Reintentar</button></div>`:`<div class="empty"><div class="e">🎾</div>Calentando en la pista…</div>`;return}
  let h="";
  if(!S.canWrite)h+=`<div class="banner">👀 Modo grada: puedes mirar pero no apuntar nada. Pide al que montó esto que te invite como Editor.</div>`;
  h+=({partidos:vPartidos,ranking:vRanking,cervezas:vCervezas,grupo:vGrupo,candidatos:vCandidatos}[S.view]||vPartidos)();
  app.innerHTML=h;
  hydratePhotos();
}
function renderMe(){
  const sel=$("#meSel"),me=getMe();
  const opts=`<option value="">— elige —</option>`+S.players.filter(p=>!p.retired).map(p=>`<option value="${esc(p.id)}" ${p.id===me?"selected":""}>${esc(p.emoji||"")} ${esc(p.name)}</option>`).join("");

function awards(){

  if(r.length>2){const l=r[r.length-1];out.push({t:"🥄 Cuchara de madera",n:esc(pav(l.id)+" "+pname(l.id)),d:"Alguien tiene que ser el último"})}
  const mp=[...r].sort((a,b)=>b.pj-a.pj)[0];out.push({t:"🔋 Duracell",n:esc(pav(mp.id)+" "+pname(mp.id)),d:mp.pj+" partidos jugados"});
  const st=[...r].sort((a,b)=>b.streak-a.streak)[0];if(st.streak>=2)out.push({t:"🔥 En racha",n:esc(pav(st.id)+" "+pname(st.id)),d:st.streak+" victorias seguidas"});

async function hydratePhotos(){
  for(const img of document.querySelectorAll("img[data-photo-id],img[data-photo-doc]")){
    const id=img.dataset.photoId,doc=img.dataset.photoDoc;
    if(id){img.src="/_blob/"+id;img.onerror=()=>{img.replaceWith(Object.assign(document.createElement("div"),{className:"muted",textContent:"📷 La foto no carga"}))};continue}
    if(doc){
      if(photoCache[doc]){img.src=photoCache[doc];continue}
      try{const s=await db.doc("photos/"+doc).get();if(s.exists){photoCache[doc]=s.data().data;img.src=photoCache[doc]}}catch(e){}

}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roundRobin(pairs){
  // todos contra todos, ordenado para que nadie juegue dos seguidos si se puede
  const all=[];for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++)all.push([pairs[i],pairs[j]]);
  const out=[];let pool=shuffle(all);
  while(pool.length){
    const last=out[out.length-1];const ids=last?[...last[0],...last[1]]:[];
    let k=pool.findIndex(m=>![...m[0],...m[1]].some(x=>ids.includes(x)));if(k<0)k=0;
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function jGenerate(){
  let pairs=[],rest=[];
  if(J.mode==="pairs"){
    const ps=J.pairs.filter(p=>p[0]||p[1]);
    if(ps.some(p=>!p[0]||!p[1])){J.plan={error:"Hay alguna pareja coja: completa los dos huecos."};return drawJornada()}
    const ids=ps.flat();if(new Set(ids).size!==ids.length){J.plan={error:"Alguien está en dos parejas. Ni siendo de goma 🤸"};return drawJornada()}
    if(ps.length<2){J.plan={error:"Hacen falta al menos dos parejas."};return drawJornada()}
    pairs=ps;
  }else{
    let sel=[...J.sel];
    if(sel.length<4){J.plan={error:"Con menos de 4 no hay partido. Llamad a alguien del banquillo."};return drawJornada()}
    sel=shuffle(sel);
    if(sel.length%2){
      // descansa quien más ha jugado últimamente (o al azar)
      const r=indRanking();const pj=id=>(r.find(x=>x.id===id)||{pj:0}).pj;
      sel.sort((a,b)=>pj(b)-pj(a));rest=[sel.shift()];sel=shuffle(sel);
    }
    if(J.balanced){
      const r=indRanking();const pos=id=>{const i=r.findIndex(x=>x.id===id);return i<0?99:i};
      // con algo de azar entre empatados
      const ord=[...sel].sort((a,b)=>pos(a)-pos(b)+(Math.random()-.5)*1.5);
      while(ord.length)pairs.push([ord.shift(),ord.pop()]);
    }else{for(let i=0;i<sel.length;i+=2)pairs.push([sel[i],sel[i+1]])}
  }
  J.plan={pairs,rest,matches:roundRobin(pairs)};
  drawJornada();
}

function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
async function compress(file,max,q){
  const img=await loadImg(file);const r=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res({blob:b,canvas:c}),"image/jpeg",q));
}
async function storePhoto(file){
  if(assets){
    try{const {blob}=await compress(file,1600,.82);const r=await assets.upload(blob,{type:"image/jpeg"});return{photoId:r.id,photoDoc:null}}catch(e){console.warn("upload",e)}
  }
  // plan B: foto comprimida dentro de la base de datos
  for(const [max,q] of [[1280,.75],[1000,.68],[760,.6],[560,.55]]){
    const {canvas}=await compress(file,max,q);const data=canvas.toDataURL("image/jpeg",q);
    if(data.length<850000){const ref=db.collection("photos").doc();await ref.set({data});photoCache[ref.id]=data;return{photoId:null,photoDoc:ref.id}}
  }
  throw new Error("foto demasiado grande");
}

/* ---------- boot ---------- */
(async()=>{
  route();
  const slow=setTimeout(()=>{S.slow=true;render()},10000);
  db=await __dbPromise;
  if(!db){clearTimeout(slow);$("#app").innerHTML=`<div class="card"><h2>Sin conexión</h2><p>No se pudo conectar con la base de datos.</p>${authHelp(window.__authErr)}</div>`;return}
  const sub=(col,key,fn)=>db.collection(col).onSnapshot(snap=>{
    fn(snap.docs.map(d=>({id:d.id,...d.data()})));
    S.online=!snap.metadata.fromCache;
    if(!snap.metadata.fromCache){S.loaded[key]=true;if(key==="players"){clearTimeout(slow);S.slow=false}}
    else S.loaded[key]=S.loaded[key]||snap.size>0;
    render();
  },err=>{console.error(col,err);S.dbErr=S.dbErr||err?.code||String(err);clearTimeout(slow);render()});
  sub("players","players",a=>S.players=a);
  sub("matches","matches",a=>S.matches=a);
  sub("candidates","candidates",a=>S.candidates=a);
  sub("aportaciones","aport",a=>S.aport=a);
  sub("debts","debts",a=>{S.debts={};a.forEach(d=>S.debts[d.id]=d)});
})();
</script>
</body>
